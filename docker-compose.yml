services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: telekinesis
      POSTGRES_PASSWORD: password
      POSTGRES_DB: telekinesis
    volumes:
      - telekinesis_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telekinesis -d telekinesis"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "7860:7860"
    devices:
      - /dev/video0:/dev/video0
    group_add:
      - video
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://telekinesis:password@db:5432/telekinesis
      DB_HOST: db
      DB_PORT: 5432
      JWT_SECRET: local-docker-dev-secret-change-in-production
      JWT_EXPIRE_MINUTES: 60
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      LOG_LEVEL: INFO
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  telekinesis_pg:
